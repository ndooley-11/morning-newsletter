name: Daily newsletter

'on':
  push:
    branches:
      - main
    paths-ignore:
      - site/content.json
  workflow_dispatch:
    inputs:
      regenerate:
        description: Generate fresh content before deploying
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 11,12 * * *'

concurrency:
  group: pages-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test, generate, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      edition_id: ${{ steps.content.outputs.edition_id }}
    steps:
      - name: Check out stored content and source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Generate or retain edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGENERATE: ${{ inputs.regenerate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            python generate_edition.py --output site/content.json --scheduled
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REGENERATE" == "false" ]]; then
            echo "Retaining and validating the stored edition."
          else
            python generate_edition.py --output site/content.json --force
          fi

      - name: Validate site and capture edition ID
        id: content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from validate_publication import validate_site

          required = [
              Path("site/index.html"),
              Path("site/app.js"),
              Path("site/styles.css"),
              Path("site/content.json"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required site files: " + ", ".join(missing))

          try:
              payload = json.loads(Path("site/content.json").read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"site/content.json is not valid UTF-8 JSON: {exc}") from exc

          edition = payload.get("edition")
          edition_id = validate_site(Path("site"))
          if not isinstance(edition_id, str) or not edition_id.strip():
              raise SystemExit("site/content.json must contain a non-empty edition.id string")
          if any(character in edition_id for character in "\r\n\0"):
              raise SystemExit("edition.id contains a forbidden control character")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"edition_id={edition_id}\n")
          print(f"Validated edition: {edition_id}")
          PY

      - name: Reject unexpected generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          )
          entries = [entry for entry in raw.decode("utf-8").split("\0") if entry]
          unexpected = []
          for entry in entries:
              path = entry[3:]
              if path != "site/content.json":
                  unexpected.append(entry)
          if unexpected:
              raise SystemExit(
                  "Generator or tests changed files outside site/content.json:\n"
                  + "\n".join(unexpected)
              )
          PY

      - name: Persist changed content
        shell: bash
        run: |
          set -euo pipefail
          git add -- site/content.json
          if git diff --cached --quiet -- site/content.json; then
            echo "Stored content is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update daily content [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy and verify Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify published edition
        env:
          EXPECTED_EDITION_ID: ${{ needs.build.outputs.edition_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = os.environ["EXPECTED_EDITION_ID"]
          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          content_url = urllib.parse.urljoin(base, "content.json")
          url = content_url + "?expected_id=" + urllib.parse.quote(expected, safe="")
          last_error = "no response"

          for attempt in range(1, 11):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json", "User-Agent": "pages-edition-check"},
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      payload = json.load(response)
                  edition = payload.get("edition")
                  actual = edition.get("id") if isinstance(edition, dict) else None
                  if actual == expected:
                      print(f"Published edition verified on attempt {attempt}: {actual}")
                      break
                  last_error = f"expected edition.id {expected!r}, received {actual!r}"
              except (OSError, ValueError, urllib.error.URLError) as exc:
                  last_error = repr(exc)

              print(f"Attempt {attempt}/10 failed: {last_error}")
              if attempt < 10:
                  time.sleep(10)
          else:
              raise SystemExit(
                  f"Published content verification failed after 10 attempts: {last_error}"
              )
          PY
